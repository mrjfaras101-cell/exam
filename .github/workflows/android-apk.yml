name: بناء APK (أندرويد)

on:
  push:
    branches: [arena/01a0fc3b-exam, main]
    paths:
      - 'app/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # لنشر الإصدار التجريبي مع ملف APK

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true   # دفعة جديدة تُلغي البناء القديم (توفير وقت المشغّل)

jobs:
  apk:
    name: بناء ملف APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # تاريخ كامل: يمنع أي مشاكل في الدفع/الإصدارات

      - name: تهيئة Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: معلومات البيئة
        run: |
          flutter --version && dart --version
          mkdir -p /tmp/ci-logs        # مجلد سجلات الخطوات الحرجة (للتشخيص عند الفشل)

      - name: توليد مجلد أندرويد
        working-directory: app
        run: |
          flutter create . --platforms=android --project-name musahhih --org com.musahhih
          # لا نسمح لأي ملف من مصادرنا أن يُستبدل
          git checkout -- pubspec.yaml lib test analysis_options.yaml 2>/dev/null || true
          rm -f test/widget_test.dart
          python3 tool/apply_platform_config.py || true
          echo "--- pubspec (أول 25 سطرًا) ---"
          head -25 pubspec.yaml
          echo "--- AndroidManifest ---"
          cat android/app/src/main/AndroidManifest.xml

      - name: التبعيات
        working-directory: app
        run: flutter pub get

      - name: أيقونة التطبيق من الشعار
        working-directory: app
        run: |
          set -o pipefail
          # الأيقونات مُولَّدة مسبقًا ومُلتزمة في assets/branding/icons
          # (لا نعتمد على أداة خارجية أثناء البناء)
          python3 tool/install_app_icons.py 2>&1 | tee /tmp/ci-logs/icons.log

      - name: فحوصات محرّك القراءة (Node + Python)
        run: |
          node demo/test/check_dart_parity.mjs
          node demo/test/grading_test.mjs

      - name: توافقية compileSdk للحزم (إصلاح مؤقت)
        working-directory: app
        run: |
          # بعض الحزم تُصرّف نفسها بـ compileSdk أقدم من متطلبات androidx الحديثة
          python3 tool/fix_pub_cache_compile_sdk.py --sdk 36 --min-sdk 24
          mkdir -p "$HOME/.gradle/init.d"
          cp tool/android-init.gradle "$HOME/.gradle/init.d/compile-sdk.gradle"

      - name: التحليل (flutter analyze)
        id: analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/ci-logs/analyze.log

      - name: الاختبارات (flutter test)
        id: test
        working-directory: app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/ci-logs/test.log

      - name: بناء APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/ci-logs/build.log

      - name: تجهيز المخرجات
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/musahhih-1.0.0.apk
          ls -lh dist/
          sha256sum dist/musahhih-1.0.0.apk | tee dist/musahhih-1.0.0.apk.sha256

      - name: رفع APK كأثر للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: musahhih-apk
          path: dist/*
          retention-days: 30

      - name: نشر إصدار تجريبي مع ملف APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="نسخة تجريبية من تطبيق «مُصحِّح — Basem» لتصحيح أوراق الاختبارات بالكاميرا.

          الجديد في هذه النسخة:
          • ورقة الإجابة بنصف A4 — نسختان في كل صفحة A4 (40 طالبًا = 20 ورقة طباعة فقط).
          • عدد الأسئلة حتى 40 سؤالًا في ورقة واحدة.
          • في الاختبارات المختلطة: أسئلة «نعم أو لا» تأتي دائمًا في آخر الورقة ومتتالية.
          • شعار جديد للتطبيق باسم Basem + أيقونة تطبيق جديدة.

          التركيب: افتح الرابط من جوال أندرويد، ثم اسمح بالتثبيت من مصادر غير معروفة.
          ملاحظة: الملف موقّع بمفتاح التطوير (للتجربة، وليس للنشر على Google Play)."
          gh release delete apk-demo --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-demo dist/musahhih-1.0.0.apk \
            --title "مُصحِّح — نسخة تجريبية (APK)" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: تقرير الفشل (سجلات مقروءة من واجهة GitHub)
        if: failure()
        run: python3 .github/scripts/ci_log_report.py

      - name: ملخص النتيجة
        if: always()
        run: |
          echo "### نتيجة البناء" >> $GITHUB_STEP_SUMMARY
          echo "- التحليل: ${{ steps.analyze.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- الاختبارات: ${{ steps.test.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- رابط التنزيل: https://github.com/${{ github.repository }}/releases/download/apk-demo/musahhih-1.0.0.apk" >> $GITHUB_STEP_SUMMARY
