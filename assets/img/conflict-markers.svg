<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="'JetBrains Mono',monospace">
  <text x="960" y="28" text-anchor="end" font-size="15" font-weight="700" fill="#12203C" font-family="'IBM Plex Sans Arabic','Segoe UI',sans-serif">بنية علامات التعارض في الملف — Conflict markers</text>

  <!-- file frame -->
  <rect x="40" y="50" width="900" height="330" rx="10" fill="#0F172A"/>
  <rect x="40" y="50" width="900" height="28" rx="10" fill="#0A1120"/>
  <circle cx="62" cy="64" r="5" fill="#FF5F57"/><circle cx="80" cy="64" r="5" fill="#FEBC2E"/><circle cx="98" cy="64" r="5" fill="#28C840"/>
  <text x="120" y="68" font-size="11" fill="#8FA3C0">data/members-index.json</text>

  <g font-size="13.5" fill="#E6EDF7">
    <text x="62" y="108">"files": [</text>

    <text x="62" y="140" fill="#F08C7A">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
    <text x="86" y="164" fill="#5AD1A0">"leen-docs.json",</text>
    <text x="62" y="192" fill="#F08C7A">=======</text>
    <text x="86" y="216" fill="#FFB86B">"omar-qa.json",</text>
    <text x="62" y="244" fill="#F08C7A">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/omar-qa-card</text>

    <text x="62" y="280">  "sara-design.json"</text>
    <text x="62" y="304">]</text>
  </g>

  <!-- annotations -->
  <g font-family="'IBM Plex Sans Arabic','Segoe UI',sans-serif" font-size="12.5">
    <line x1="430" y1="136" x2="560" y2="136" stroke="#5AD1A0" stroke-width="1.4"/>
    <text x="570" y="140" fill="#0B6244" font-weight="700">A) نسختك الحالية (الفرع الذي تستهدفه)</text>
    <text x="570" y="158" fill="#8494A8" font-size="11">your current branch — “ours”</text>

    <line x1="430" y1="240" x2="560" y2="240" stroke="#FFB86B" stroke-width="1.4"/>
    <text x="570" y="228" fill="#9A420A" font-weight="700">B) النسخة القادمة (الفرع المدموج)</text>
    <text x="570" y="246" fill="#8494A8" font-size="11">the incoming branch — “theirs”</text>

    <line x1="230" y1="186" x2="560" y2="186" stroke="#F08C7A" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="570" y="190" fill="#8C1D17" font-weight="700">C) الفاصل: نهاية نسختك وبداية الأخرى</text>
  </g>

  <text x="490" y="404" text-anchor="middle" font-size="12.5" fill="#12203C" font-family="'IBM Plex Sans Arabic','Segoe UI',sans-serif" font-weight="600">
    الحل: احذف الأسطر الثلاثة للعلامات، واترك النتيجة الصحيحة، ثم git add ثم git merge --continue
  </text>
</svg>
